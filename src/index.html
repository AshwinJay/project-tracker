    /* ─── Sparkline ─── */
    function Sparkline(props){
      var data=props.data,width=props.width||48,height=props.height||14,color=props.color;
      if(!data||data.length<2) return <div style={{width:width,height:height}}/>;
      var pts=data.map(function(v,i){return((i/(data.length-1))*width)+","+(height-v*height)});
      var last=pts[pts.length-1].split(",");
      return <svg width={width} height={height} style={{display:"block",flexShrink:0}}>
        <polyline points={pts.join(" ")} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
        <circle cx={parseFloat(last[0])} cy={parseFloat(last[1])} r="2" fill={color}/>
      </svg>;
    }

    /* ─── Hill Chart ─── */
    function HillChart(props){
      var scopes=props.scopes,theme=props.theme,onUpdateHill=props.onUpdateHill,selectedId=props.selectedId,onSelect=props.onSelect;
      var ref=useRef(null),dragId=useRef(null);
      var W=640,H=210,P=28;
      var hY=useCallback(function(px){var n=(px-P)/(W-2*P);return H-P-(Math.sin(Math.max(0,Math.min(1,n))*Math.PI)*(H-2*P-24))},[]);

      var pathD=useMemo(function(){return Array.from({length:W-2*P+1},function(_,i){var x=i+P;return(i===0?"M":"L")+x+","+hY(x)}).join(" ")},[hY]);
      return <svg ref={ref} viewBox={"0 0 "+W+" "+(H+10)} style={{width:"100%",height:"auto",cursor:dragId.current?"grabbing":"default",touchAction:"none"}}
        onPointerMove={function(e){if(dragId.current)onUpdateHill(dragId.current,toH(e.clientX))}}
        onPointerUp={function(){dragId.current=null}} onPointerLeave={function(){dragId.current=null}}>
        <path d={pathD+" L"+(W-P)+","+(H-P)+" L"+P+","+(H-P)+" Z"} fill={theme.hillFill}/>
        <path d={pathD} fill="none" stroke={theme.hillStroke} strokeWidth="2" opacity=".35"/>
        <line x1={W/2} y1={P-14} x2={W/2} y2={H-P} stroke={theme.border} strokeDasharray="4 4"/>

    /* ─── Timeline ─── */
    function Timeline(props){
      var scopes=props.scopes,theme=props.theme,currentWeek=props.currentWeek,totalWeeks=props.totalWeeks;

                </div>}
                {w===1&&<div style={{position:"absolute",top:3,bottom:3,left:"50%",width:2,background:theme.green,opacity:.35,borderRadius:1,transform:"translateX(-1px)"}}/>}
                {w===totalWeeks&&<div style={{position:"absolute",top:3,bottom:3,left:"50%",width:2,background:theme.blue,opacity:.35,borderRadius:1,transform:"translateX(-1px)"}}/>}

              </div>)}

    /* ═══════════════════ MAIN ═══════════════════ */
    function App(){

      var scopeChangeDays=useMemo(function(){

      },[changes]);

      function saveScope(){

          setScopes(function(p){return p.concat([{id:"s"+Date.now(),name:form.name||"New Scope",hill:.05,status:"on-track",owner:(form.owner||"??").slice(0,2).toUpperCase(),startWeek:parseInt(form.startWeek)||curW,endWeek:parseInt(form.endWeek)||totalWeeks,history:[.05]}])});
        }else{
          setScopes(function(p){return p.map(function(s){if(s.id!==form.id)return s;return Object.assign({},s,{name:form.name||s.name,owner:(form.owner||s.owner).slice(0,2).toUpperCase(),startWeek:parseInt(form.startWeek)||s.startWeek,endWeek:parseInt(form.endWeek)||s.endWeek,status:form.status||s.status})})});
        }
        setModal(null);
      }
      function addRisk(){setRisks(function(p){return p.concat([{id:"r"+Date.now(),title:form.title||"New Risk",prob:form.prob||"medium",impact:form.impact||"medium",mitigation:form.mitigation||"",owner:form.owner||"??"}])});setModal(null)}
      function addChange(){setChanges(function(p){return p.concat([{id:"c"+Date.now(),date:form.date||new Date().toLocaleDateString("en-US",{month:"short",day:"2-digit"}),title:form.title||"New Change",impact:form.impact||"+0d",status:"pending",scope:form.scope||""}])});setModal(null)}
      function startCompare(snapId){setCmpA(snapId);setCmpB("current");setSnapView("compare");setTab("snapshots")}
      function getStateForCmp(id){if(!id)return null;if(id==="current")return{project:project,scopes:scopes,risks:risks,changes:changes};return snapshots.find(function(s){return s.id===id})||null}
      function openSnapshot(){var now=new Date();var lbl="Week "+curW+" — "+now.toLocaleDateString("en-US",{month:"short",day:"numeric"});setForm({label:lbl});setModal("snapshot")}
      function saveSnapshot(){var now=new Date();var snap={schemaVersion:1,id:"snap_"+now.getTime(),timestamp:now.toISOString(),label:form.label||("Week "+curW+" — "+now.toLocaleDateString("en-US",{month:"short",day:"numeric"})),project:Object.assign({},project),scopes:scopes.map(function(s){return Object.assign({},s)}),risks:risks.map(function(r){return Object.assign({},r)}),changes:changes.map(function(c){return Object.assign({},c)}),burnActuals:Object.assign({},burnActuals)};setScopes(function(p){return p.map(function(s){return Object.assign({},s,{history:(s.history||[]).concat([s.hill])})})});setSnapshots(function(p){return p.concat([snap])});setModal(null)}
      function resetAll(){setProject(DEF_PROJECT);setScopes(DEF_SCOPES);setRisks(DEF_RISKS);setChanges(DEF_CHANGES)}

      function openProject(){setForm({title:project.title,cycle:project.cycle,startDate:project.startDate,endDate:project.endDate,currentWeek:String(project.currentWeek),bufferDays:String(project.bufferDays||0),slippageDays:String(project.slippageDays||0)});setModal("project")}
      function saveProject(){setProject({title:form.title||project.title,cycle:form.cycle||project.cycle,startDate:form.startDate||project.startDate,endDate:form.endDate||project.endDate,currentWeek:parseInt(form.currentWeek)||1,bufferDays:parseInt(form.bufferDays)||0,slippageDays:parseInt(form.slippageDays)||0});setModal(null)}

      var tabs=[{id:"hill",label:"Hill Chart"},{id:"timeline",label:"Timeline"},{id:"burndown",label:"Burndown"},{id:"risks",label:"Risks ("+risks.length+")"},{id:"changes",label:"Changes"+(changes.some(function(c){return c.status==="pending"})?" ●":"")},{id:"snapshots",label:"Snapshots ("+snapshots.length+")"}];

      if(!loaded) return <div style={{fontFamily:FT,background:t.bg,color:t.textMuted,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>Loading…</div>;

      return <div style={{fontFamily:FT,background:t.bg,color:t.text,minHeight:"100vh",transition:"background .3s,color .3s"}}>
      <div style={{width:"85%",margin:"0 auto",padding:"20px 14px"}}>

        {/* Header */}
        <div style={{margin:"0 auto 16px",display:"flex",alignItems:"flex-start",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
          <div onClick={openProject} style={{cursor:"pointer"}} title="Edit project settings">
            <h1 style={{fontSize:21,fontWeight:700,margin:0,letterSpacing:"-.02em",display:"flex",alignItems:"center",gap:6}}>
              {project.title} <span style={{fontSize:13,color:t.textFaint,fontWeight:400}}>✎</span>
            </h1>
            <p style={{margin:"2px 0 0",color:t.textMuted,fontSize:12}}>
              {project.cycle} · {fmtD(project.startDate)} – {fmtD(project.endDate)} · Week {curW} of {totalWeeks}
              {overScopes.length>0&&<span style={{color:t.amber,fontWeight:600}}>{" · "+overScopes.length+" scope"+(overScopes.length>1?"s":"")+" past deadline"}</span>}
            </p>
          </div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            <button onClick={openSnapshot} style={{background:t.surfaceAlt,border:"1px solid "+t.border,borderRadius:8,padding:"5px 10px",color:t.textMuted,cursor:"pointer",fontSize:11,fontFamily:FT,fontWeight:600}}>📸 Snapshot</button>
            <button onClick={resetAll} style={{background:t.surfaceAlt,border:"1px solid "+t.border,borderRadius:8,padding:"5px 10px",color:t.textMuted,cursor:"pointer",fontSize:11,fontFamily:FT}}>↺ Reset</button>
            <button onClick={function(){setDark(!dark)}} style={{background:t.surfaceAlt,border:"1px solid "+t.border,borderRadius:8,padding:"5px 10px",color:t.textMuted,cursor:"pointer",fontSize:12,fontFamily:FT}}>{dark?"☀":"●"}</button>
          </div>
        </div>

        {/* Summary */}
        <div style={{margin:"0 auto 12px",display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
          {[
            {l:"On Track",v:counts["on-track"],c:t.green,b:t.greenSoft,click:null},
            {l:"At Risk",v:counts["at-risk"],c:t.amber,b:t.amberSoft,click:null},
            {l:"Blocked",v:counts["blocked"],c:t.red,b:t.redSoft,click:null},
            {l:"Buffer",v:bufferOver?"-"+(bufferUsed-bufferTotal)+"d":bufferRem+"d",c:bufferOver?t.red:bufferPct>70?t.amber:t.blue,b:bufferOver?t.redSoft:bufferPct>70?t.amberSoft:t.blueSoft,click:openProject}
          ].map(function(o){return <div key={o.l} onClick={o.click} style={{background:t.surface,border:"1px solid "+t.border,borderRadius:10,padding:"11px 12px",boxShadow:t.shadow,cursor:o.click?"pointer":"default"}}>
            <div style={{fontSize:9,color:t.textMuted,marginBottom:2,textTransform:"uppercase",letterSpacing:".06em",fontWeight:500}}>{o.l}{o.l==="Buffer"?(bufferOver?" OVERRUN":" left"):""}</div>
            <div style={{fontSize:22,fontWeight:700,color:o.c,fontFamily:MO}}>{o.v}</div>
          </div>})}
        </div>

        {/* Buffer bar */}
        <div style={{margin:"0 auto 14px",background:t.surface,border:"1px solid "+t.border,borderRadius:10,padding:"10px 14px",boxShadow:t.shadow}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6,flexWrap:"wrap",gap:4}}>
            <span style={{fontSize:10,fontWeight:600,textTransform:"uppercase",letterSpacing:".04em"}}>Schedule Buffer</span>
            <span style={{fontSize:10,color:t.textMuted}}>{bufferUsed}d consumed of {bufferTotal}d planned</span>
          </div>
          <div style={{height:6,borderRadius:6,background:t.surfaceAlt,overflow:"hidden"}}>
            <div style={{height:"100%",width:Math.min(bufferPct,100)+"%",borderRadius:6,background:bufferOver?t.red:bufferPct>70?t.red:bufferPct>50?t.amber:t.accent,transition:"width .4s"}}/>
          </div>
          <div style={{display:"flex",gap:12,marginTop:8,flexWrap:"wrap"}}>
            <div style={{display:"flex",alignItems:"center",gap:5}}>
              <div style={{width:8,height:8,borderRadius:2,background:scopeChangeDays.net>0?t.red:scopeChangeDays.net<0?t.green:t.textFaint}}/>
              <span style={{fontSize:10,color:t.textMuted}}>Scope: <span style={{fontFamily:MO,fontWeight:700,color:scopeChangeDays.net>0?t.red:scopeChangeDays.net<0?t.green:t.textMuted}}>{(scopeChangeDays.net>0?"+":"")+scopeChangeDays.net+"d"}</span></span>
              <span style={{fontSize:9,color:t.textFaint}}>({scopeChangeDays.adds}d added, {scopeChangeDays.saves}d saved)</span>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:5}}>
              <div style={{width:8,height:8,borderRadius:2,background:slippageDays>0?t.amber:t.textFaint}}/>
              <span style={{fontSize:10,color:t.textMuted}}>Slippage: <span style={{fontFamily:MO,fontWeight:700,color:slippageDays>0?t.amber:t.textMuted}}>{"+"+slippageDays+"d"}</span></span>
            </div>
          </div>
          {bufferOver&&<div style={{fontSize:11,color:t.red,marginTop:6,fontWeight:600}}>{"⚠ Buffer exceeded by "+(bufferUsed-bufferTotal)+"d"}</div>}
        </div>

        {/* Tabs */}
        <div style={{margin:"0 auto 12px",display:"flex",gap:2,background:t.surfaceAlt,borderRadius:10,padding:3,overflowX:"auto"}}>
          {tabs.map(function(tb){return <button key={tb.id} onClick={function(){setTab(tb.id)}} style={{
            flex:1,padding:"7px 0",border:"none",borderRadius:8,cursor:"pointer",fontFamily:FT,minWidth:0,
            fontSize:11,fontWeight:600,transition:"all .2s",whiteSpace:"nowrap",
            background:tab===tb.id?t.surface:"transparent",color:tab===tb.id?t.text:t.textMuted,
            boxShadow:tab===tb.id?t.shadow:"none"
          }}>{tb.label}</button>})}
        </div>

        <div style={{margin:"0 auto"}}>

          {/* HILL */}
          {tab==="hill"&&<div style={{background:t.surface,border:"1px solid "+t.border,borderRadius:12,padding:"16px 16px 20px",boxShadow:t.shadow}}>
            <HelpBanner theme={t} text="Left = figuring out. Right = executing. Drag dots to update. ✎ to edit. Tap pills to cycle status."/>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <h2 style={{fontSize:13,fontWeight:600,margin:0}}>Scope Progress</h2>
              <button onClick={openAddScope} style={{background:t.accentSoft,color:t.accent,border:"none",borderRadius:8,padding:"4px 10px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:FT}}>+ Scope</button>
            </div>
            <HillChart scopes={scopes} theme={t} onUpdateHill={onUpdateHill} selectedId={selScope} onSelect={setSelScope}/>
            <div style={{marginTop:12,display:"flex",flexDirection:"column",gap:4}}>
              {scopes.slice().sort(function(a,b){return b.hill-a.hill}).map(function(s){
                var col=s.status==="blocked"?t.red:s.status==="at-risk"?t.amber:t.green;
                var bg2=s.status==="blocked"?t.redSoft:s.status==="at-risk"?t.amberSoft:t.greenSoft;
                var over=s.endWeek>totalWeeks;
                return <div key={s.id} onClick={function(){setSelScope(s.id===selScope?null:s.id)}} style={{
                  display:"flex",alignItems:"center",gap:7,padding:"6px 10px",borderRadius:8,
                  background:s.id===selScope?t.accentSoft:t.surfaceAlt,cursor:"pointer",transition:"background .15s"
                }}>
                  <span style={{width:24,height:24,borderRadius:"50%",background:t.accentSoft,color:t.accent,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,fontFamily:MO,flexShrink:0}}>{s.owner}</span>
                  <span style={{flex:1,fontSize:12,fontWeight:500,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                    {s.name}{over&&<span style={{color:t.amber,fontSize:10,fontWeight:600}}>{" (→W"+s.endWeek+")"}</span>}
                  </span>
                  <Sparkline data={s.history} width={48} height={14} color={col}/>
                  <span style={{fontSize:10,fontFamily:MO,color:t.textMuted,width:30,textAlign:"right"}}>{Math.round(s.hill*100)+"%"}</span>
                  <Pill label={s.status.replace("-"," ")} color={col} bg={bg2} onClick={function(e){e.stopPropagation();cycleStatus(s.id)}}/>
                  <button onClick={function(e){e.stopPropagation();openEditScope(s)}} style={{background:"none",border:"none",color:t.textMuted,cursor:"pointer",fontSize:11,padding:"0 2px"}}>✎</button>
                  <button onClick={function(e){e.stopPropagation();setScopes(function(p){return p.filter(function(x){return x.id!==s.id})})}} style={{background:"none",border:"none",color:t.textFaint,cursor:"pointer",fontSize:13,padding:"0 1px"}}>×</button>
                </div>})}
            </div>
          </div>}

          {/* TIMELINE */}
          {tab==="timeline"&&<div style={{background:t.surface,border:"1px solid "+t.border,borderRadius:12,padding:"16px 16px 20px",boxShadow:t.shadow}}>
            <HelpBanner theme={t} text="Bars = time windows. Fill = hill progress. Orange = now. Red dashed = past deadline."/>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:12,flexWrap:"wrap"}}>
              <h2 style={{fontSize:13,fontWeight:600,margin:0,flex:1,minWidth:120}}>Timeline <span style={{fontWeight:400,color:t.textMuted,fontSize:11}}>{"— "+totalWeeks+" budgeted"+(maxW>totalWeeks?", showing "+maxW:"")}</span></h2>
              {["on-track","at-risk","blocked"].map(function(st){
                var active=tlFilter.indexOf(st)>=0;
                var col=st==="blocked"?t.red:st==="at-risk"?t.amber:t.green;
                var bg=st==="blocked"?t.redSoft:st==="at-risk"?t.amberSoft:t.greenSoft;
                return <button key={st} onClick={function(){toggleTlFilter(st)}} style={{fontSize:10,fontWeight:600,padding:"3px 9px",borderRadius:99,color:active?col:t.textFaint,background:active?bg:"transparent",border:"1px solid "+(active?col:t.border),textTransform:"uppercase",letterSpacing:".04em",cursor:"pointer",fontFamily:FT,opacity:active?1:0.45,transition:"opacity .15s"}}>{st.replace("-"," ")}</button>
              })}
            </div>
            <Timeline scopes={visibleScopes} theme={t} currentWeek={curW} totalWeeks={totalWeeks}/>
            {overScopes.filter(function(s){return tlFilter.indexOf(s.status)>=0}).length>0&&<p style={{fontSize:11,color:t.amber,marginTop:10,fontWeight:500}}>{"⚠ "+overScopes.filter(function(s){return tlFilter.indexOf(s.status)>=0}).map(function(s){return s.name}).join(", ")+" extend"+(overScopes.filter(function(s){return tlFilter.indexOf(s.status)>=0}).length===1?"s":"")+" past W"+totalWeeks}</p>}
          </div>}

          {/* BURNDOWN */}
          {tab==="burndown"&&<div style={{background:t.surface,border:"1px solid "+t.border,borderRadius:12,padding:"16px 16px 20px",boxShadow:t.shadow}}>
            <HelpBanner theme={t} text="Ideal = even burn. Actual = reality. The gap is schedule risk consuming buffer."/>
            <h2 style={{fontSize:13,fontWeight:600,margin:"0 0 12px"}}>Burndown</h2>
            <div style={{overflowX:"auto"}}>
              <AreaChart width={Math.max(700,maxW*80)} height={240} data={burnData} margin={{top:8,right:8,bottom:0,left:-20}}>
                <CartesianGrid stroke={t.grid} strokeDasharray="3 3"/>
                <XAxis dataKey="day" tick={{fill:t.textMuted,fontSize:10}} axisLine={{stroke:t.border}} tickLine={false}/>
                <YAxis tick={{fill:t.textMuted,fontSize:10}} axisLine={false} tickLine={false} domain={[0,100]} tickFormatter={function(v){return v+"%"}}/>
                <Tooltip contentStyle={{background:t.surface,border:"1px solid "+t.border,borderRadius:8,fontSize:11,fontFamily:FT}}/>
                {maxW>totalWeeks&&<ReferenceLine x={"W"+(totalWeeks+1)} stroke={t.red} strokeDasharray="4 4" label={{value:"Deadline",fill:t.red,fontSize:9}}/>}
                <ReferenceLine x={"W"+curW} stroke={t.accent} strokeDasharray="4 4" label={{value:"Now",fill:t.accent,fontSize:10}}/>
                <Area type="monotone" dataKey="ideal" stroke={t.burnIdeal} strokeWidth={2} strokeDasharray="6 4" fill="none" name="Ideal" dot={false}/>
                <Area type="monotone" dataKey="actual" stroke={t.burnActual} strokeWidth={2.5} fill={t.burnFill} name="Actual" dot={{r:3,fill:t.burnActual,stroke:t.surface,strokeWidth:2}} connectNulls={false}/>
              </AreaChart>
            </div>
          </div>}

          {/* RISKS */}
          {tab==="risks"&&<div style={{background:t.surface,border:"1px solid "+t.border,borderRadius:12,padding:"16px 16px 20px",boxShadow:t.shadow}}>
            <HelpBanner theme={t} text="Both P+I high = critical. Either high = elevated. Otherwise moderate."/>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <h2 style={{fontSize:13,fontWeight:600,margin:0}}>Risk Register</h2>
              <button onClick={function(){setForm({title:"",prob:"medium",impact:"medium",mitigation:"",owner:""});setModal("add-risk")}}
                style={{background:t.accentSoft,color:t.accent,border:"none",borderRadius:8,padding:"4px 10px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:FT}}>+ Risk</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:7}}>
              {risks.map(function(r){var sev=(r.prob==="high"&&r.impact==="high")?"critical":(r.prob==="high"||r.impact==="high")?"elevated":"moderate";
                var sc=sev==="critical"?t.red:sev==="elevated"?t.amber:t.blue;var sb=sev==="critical"?t.redSoft:sev==="elevated"?t.amberSoft:t.blueSoft;
                return <div key={r.id} style={{padding:"11px 13px",borderRadius:10,background:t.surfaceAlt,borderLeft:"3px solid "+sc}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:4}}>
                    <span style={{fontSize:12,fontWeight:600}}>{r.title}</span>
                    <div style={{display:"flex",gap:5,alignItems:"center",flexShrink:0}}>
                      <Pill label={sev} color={sc} bg={sb}/>
                      <button onClick={function(){setRisks(function(p){return p.filter(function(x){return x.id!==r.id})})}} style={{background:"none",border:"none",color:t.textFaint,cursor:"pointer",fontSize:13,padding:0}}>×</button>
                    </div>
                  </div>
                  <div style={{fontSize:10,color:t.textMuted,marginBottom:3}}>{"P: "+r.prob+" · I: "+r.impact+" · Owner: "+r.owner}</div>
                  <div style={{fontSize:11,color:t.textMuted,lineHeight:1.5}}><span style={{color:t.text,fontWeight:500}}>Mitigation: </span>{r.mitigation}</div>
                </div>})}
            </div>
          </div>}

          {/* CHANGES */}
          {tab==="changes"&&<div style={{background:t.surface,border:"1px solid "+t.border,borderRadius:12,padding:"16px 16px 20px",boxShadow:t.shadow}}>
            <HelpBanner theme={t} text={"Impact feeds buffer automatically. Tap pills: pending → approved → rejected. Net approved: "+(scopeChangeDays.net>0?"+":"")+scopeChangeDays.net+"d."}/>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:6}}>
              <h2 style={{fontSize:13,fontWeight:600,margin:0}}>Change Log</h2>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <span style={{fontSize:10,color:t.textMuted}}>Net: <span style={{color:scopeChangeDays.net>0?t.red:scopeChangeDays.net<0?t.green:t.textMuted,fontWeight:700,fontFamily:MO}}>{(scopeChangeDays.net>0?"+":"")+scopeChangeDays.net+"d"}</span></span>
                <button onClick={function(){setForm({date:"",title:"",impact:"+0d",status:"pending",scope:""});setModal("add-change")}}
                  style={{background:t.accentSoft,color:t.accent,border:"none",borderRadius:8,padding:"4px 10px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:FT}}>+ Change</button>
              </div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:5}}>
              {changes.map(function(c){var stC=c.status==="approved"?t.green:c.status==="pending"?t.amber:t.textFaint;
                var stB=c.status==="approved"?t.greenSoft:c.status==="pending"?t.amberSoft:t.surfaceAlt;
                var neg=c.impact.indexOf("-")>=0;
                return <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderRadius:10,background:t.surfaceAlt}}>
                  <span style={{fontSize:9,color:t.textFaint,fontFamily:MO,width:40,flexShrink:0}}>{c.date}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:11,fontWeight:500,marginBottom:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.title}</div>
                    <div style={{fontSize:9,color:t.textMuted}}>{c.scope}</div>
                  </div>
                  <span style={{fontSize:12,fontWeight:700,fontFamily:MO,color:neg?t.green:t.red,flexShrink:0}}>{c.impact}</span>
                  <Pill label={c.status} color={stC} bg={stB} onClick={function(){cycleCStatus(c.id)}}/>
                  <button onClick={function(){setChanges(function(p){return p.filter(function(x){return x.id!==c.id})})}} style={{background:"none",border:"none",color:t.textFaint,cursor:"pointer",fontSize:13,padding:0}}>×</button>
                </div>})}
            </div>
          </div>}

          {/* SNAPSHOTS */}
          {tab==="snapshots"&&<div style={{background:t.surface,border:"1px solid "+t.border,borderRadius:12,padding:"16px 16px 20px",boxShadow:t.shadow}}>
            {/* Sub-nav */}
            <div style={{display:"flex",gap:2,background:t.surfaceAlt,borderRadius:8,padding:2,marginBottom:14,width:"fit-content"}}>
              {["list","compare"].map(function(v){return <button key={v} onClick={function(){setSnapView(v)}} style={{padding:"5px 14px",border:"none",borderRadius:6,cursor:"pointer",fontFamily:FT,fontSize:11,fontWeight:600,transition:"all .2s",background:snapView===v?t.surface:"transparent",color:snapView===v?t.text:t.textMuted,boxShadow:snapView===v?t.shadow:"none"}}>{v==="list"?"List":"Compare"}</button>})}
            </div>

            {/* LIST */}
            {snapView==="list"&&(snapshots.length===0
              ?<div style={{textAlign:"center",padding:"30px 0",color:t.textMuted,fontSize:12}}>No snapshots yet — click 📸 Snapshot to save one.</div>
              :<div style={{display:"flex",flexDirection:"column",gap:6}}>
                {snapshots.slice().reverse().map(function(snap){
                  var scd=computeScopeChangeDays(snap.changes);
                  var buf=computeBuffer(snap.project.bufferDays,snap.project.slippageDays||0,scd.net);
                  var atRisk=snap.scopes.filter(function(s){return s.status==="at-risk"||s.status==="blocked"}).length;
                  var isPendDel=pendingDelId===snap.id;
                  return <div key={snap.id} style={{padding:"11px 13px",borderRadius:10,background:t.surfaceAlt,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:600,fontSize:13}}>{snap.label}</div>
                      <div style={{fontSize:10,color:t.textMuted,marginTop:1}}>{fmtSnapTime(snap.timestamp)}</div>
                      <div style={{display:"flex",gap:10,marginTop:4}}>
                        <span style={{fontSize:10,color:t.textFaint}}>{snap.scopes.length+" scope"+(snap.scopes.length!==1?"s":"")}</span>
                        <span style={{fontSize:10,color:buf.bufferOver?t.red:t.textFaint}}>{buf.bufferRem+"d buffer"}</span>
                        {atRisk>0&&<span style={{fontSize:10,color:t.amber}}>{atRisk+" at-risk/blocked"}</span>}
                      </div>
                    </div>
                    <div style={{display:"flex",gap:5,alignItems:"center",flexShrink:0}}>
                      {!isPendDel&&<button onClick={function(){startCompare(snap.id)}} style={{fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:FT,padding:"4px 10px",borderRadius:7,border:"none",background:t.accentSoft,color:t.accent}}>Compare →</button>}
                      {!isPendDel&&<button onClick={function(){setPendingDelId(snap.id)}} style={{background:"none",border:"none",color:t.textFaint,cursor:"pointer",fontSize:14,padding:"0 2px"}}>×</button>}
                      {isPendDel&&<button onClick={function(){setSnapshots(function(p){return p.filter(function(s){return s.id!==snap.id})});setPendingDelId(null)}} style={{fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:FT,padding:"4px 10px",borderRadius:7,border:"none",background:t.redSoft,color:t.red}}>Delete?</button>}
                      {isPendDel&&<button onClick={function(){setPendingDelId(null)}} style={{fontSize:11,cursor:"pointer",fontFamily:FT,padding:"4px 8px",borderRadius:7,border:"1px solid "+t.border,background:"transparent",color:t.textMuted}}>Cancel</button>}
                    </div>
                  </div>
                })}
              </div>
            )}

            {/* COMPARE */}
            {snapView==="compare"&&(function(){
              var stA=getStateForCmp(cmpA);
              var stB=getStateForCmp(cmpB||"current");
              var scopeDiffs=stA&&stB?diffScopes(stA,stB):[];
              var rDiff=stA&&stB?diffRisks(stA,stB):null;
              var cDiff=stA&&stB?diffChanges(stA,stB):null;
              var scdA=stA?computeScopeChangeDays(stA.changes):{net:0};
              var bufA=computeBuffer(stA?stA.project.bufferDays:0,stA?stA.project.slippageDays||0:0,scdA.net);
              var scdB=stB?computeScopeChangeDays(stB.changes):{net:0};
              var bufB=computeBuffer(stB?stB.project.bufferDays:0,stB?stB.project.slippageDays||0:0,scdB.net);
              var atRA=stA?stA.scopes.filter(function(s){return s.status==="at-risk"||s.status==="blocked"}).length:0;
              var atRB=stB?stB.scopes.filter(function(s){return s.status==="at-risk"||s.status==="blocked"}).length:0;
              var slipA=stA?stA.project.slippageDays||0:0;
              var slipB=stB?stB.project.slippageDays||0:0;
              var addedSc=scopeDiffs.filter(function(d){return d.added}).length;
              var removedSc=scopeDiffs.filter(function(d){return d.removed}).length;
              var changed=scopeDiffs.filter(function(d){return d.added||d.removed||d.changed});
              var unchanged=scopeDiffs.filter(function(d){return !d.added&&!d.removed&&!d.changed});
              return <div>
                {/* Dropdowns */}
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,flexWrap:"wrap"}}>
                  <span style={{fontSize:11,fontWeight:600,color:t.textMuted}}>Compare:</span>
                  <select value={cmpA||""} onChange={function(e){setCmpA(e.target.value||null)}} style={{fontSize:11,fontFamily:FT,padding:"5px 8px",borderRadius:7,border:"1px solid "+t.border,background:t.surfaceAlt,color:t.text,cursor:"pointer"}}>
                    <option value="">— pick a snapshot —</option>
                    {snapshots.slice().reverse().map(function(s){return <option key={s.id} value={s.id}>{s.label}</option>})}
                  </select>
                  <span style={{fontSize:11,color:t.textMuted}}>vs.</span>
                  <select value={cmpB||"current"} onChange={function(e){setCmpB(e.target.value)}} style={{fontSize:11,fontFamily:FT,padding:"5px 8px",borderRadius:7,border:"1px solid "+t.border,background:t.surfaceAlt,color:t.text,cursor:"pointer"}}>
                    <option value="current">Current State</option>
                    {snapshots.slice().reverse().map(function(s){return <option key={s.id} value={s.id}>{s.label}</option>})}
                  </select>
                </div>
                {!stA&&<div style={{textAlign:"center",padding:"20px 0",color:t.textMuted,fontSize:12}}>Select a snapshot above to start comparing.</div>}
                {stA&&stB&&<div>
                  {/* Summary tiles */}
                  <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6,marginBottom:16}}>
                    {[
                      {l:"Scopes added",v:"+"+addedSc,c:addedSc>0?t.amber:t.green},
                      {l:"Scopes removed",v:"−"+removedSc,c:removedSc>0?t.amber:t.green},
                      {l:"Buffer left",v:bufA.bufferRem+"d → "+bufB.bufferRem+"d",c:bufB.bufferRem<bufA.bufferRem?t.amber:t.green},
                      {l:"Slippage",v:slipA+"d → "+slipB+"d",c:slipB>slipA?t.red:t.green},
                      {l:"At-risk+blocked",v:atRA+" → "+atRB,c:atRB>atRA?t.red:atRB<atRA?t.green:t.textMuted}
                    ].map(function(tile){return <div key={tile.l} style={{background:t.surfaceAlt,borderRadius:9,padding:"9px 10px"}}>
                      <div style={{fontSize:9,color:t.textMuted,marginBottom:3,textTransform:"uppercase",letterSpacing:".04em"}}>{tile.l}</div>
                      <div style={{fontSize:13,fontWeight:700,color:tile.c,fontFamily:MO}}>{tile.v}</div>
                    </div>})}
                  </div>
                  {/* Scope diff */}
                  <div style={{marginBottom:14}}>
                    <div style={{fontSize:11,fontWeight:700,marginBottom:7}}>Scopes</div>
                    {scopeDiffs.length===0
                      ?<div style={{fontSize:11,color:t.textMuted}}>No scopes.</div>
                      :<div style={{display:"flex",flexDirection:"column",gap:3}}>
                        {(showUnchanged?changed.concat(unchanged):changed).map(function(d){
                          var sA=d.a,sB=d.b;
                          var tag=d.added?"added":d.removed?"removed":d.changed?"changed":null;
                          var tagC=d.added?t.green:d.removed?t.red:t.amber;
                          var tagB=d.added?t.greenSoft:d.removed?t.redSoft:t.amberSoft;
                          return <div key={d.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",borderRadius:8,background:t.surfaceAlt}}>
                            <span style={{flex:1,minWidth:0,fontSize:11,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.name}</span>
                            {sA&&sB&&sA.status!==sB.status
                              ?<span style={{fontSize:10,color:t.textMuted,flexShrink:0}}>{sA.status+" → "+sB.status}</span>
                              :<span style={{fontSize:10,color:t.textMuted,flexShrink:0}}>{(sB||sA).status}</span>}
                            {sA&&sB&&sA.hill!==sB.hill
                              ?<span style={{fontSize:10,fontFamily:MO,color:t.textMuted,flexShrink:0}}>{Math.round(sA.hill*100)+"% → "+Math.round(sB.hill*100)+"%"}</span>
                              :<span style={{fontSize:10,fontFamily:MO,color:t.textFaint,flexShrink:0}}>{Math.round((sB||sA).hill*100)+"%"}</span>}
                            {sA&&sB&&sA.endWeek!==sB.endWeek&&<span style={{fontSize:10,color:t.amber,flexShrink:0}}>{"W"+sA.endWeek+" → W"+sB.endWeek}</span>}
                            {tag&&<Pill label={tag} color={tagC} bg={tagB}/>}
                          </div>
                        })}
                        {unchanged.length>0&&<button onClick={function(){setShowUnchanged(!showUnchanged)}} style={{fontSize:10,color:t.accent,background:"none",border:"none",cursor:"pointer",fontFamily:FT,padding:"4px 0",textAlign:"left"}}>
                          {showUnchanged?"▲ Hide "+unchanged.length+" unchanged":"▼ Show "+unchanged.length+" unchanged"}
                        </button>}
                      </div>}
                  </div>
                  {/* Risk diff */}
                  <div style={{marginBottom:14}}>
                    <div style={{fontSize:11,fontWeight:700,marginBottom:7}}>Risks <span style={{fontWeight:400,color:t.textMuted}}>{rDiff.countA+" → "+rDiff.countB}</span></div>
                    {rDiff.added.length===0&&rDiff.removed.length===0
                      ?<div style={{fontSize:11,color:t.textMuted}}>No changes.</div>
                      :<div style={{display:"flex",flexDirection:"column",gap:4}}>
                        {rDiff.added.map(function(r){return <div key={r.id||r.title} style={{fontSize:11,padding:"5px 10px",borderRadius:7,background:t.greenSoft,color:t.green}}>{"+ "+r.title}</div>})}
                        {rDiff.removed.map(function(r){return <div key={r.id||r.title} style={{fontSize:11,padding:"5px 10px",borderRadius:7,background:t.redSoft,color:t.red}}>{"− "+r.title}</div>})}
                      </div>}
                  </div>
                  {/* Changes diff */}
                  <div>
                    <div style={{fontSize:11,fontWeight:700,marginBottom:7}}>Change Log</div>
                    {cDiff.added.length===0&&cDiff.statusChanged.length===0
                      ?<div style={{fontSize:11,color:t.textMuted}}>No changes.</div>
                      :<div style={{display:"flex",flexDirection:"column",gap:4}}>
                        {cDiff.added.map(function(c){return <div key={c.id} style={{fontSize:11,padding:"5px 10px",borderRadius:7,background:t.greenSoft,color:t.green}}>{"+ "+c.title+" ("+c.impact+")"}</div>})}
                        {cDiff.statusChanged.map(function(c){
                          var orig=stA.changes.find(function(x){return x.id===c.id});
                          return <div key={c.id} style={{fontSize:11,padding:"5px 10px",borderRadius:7,background:t.amberSoft,color:t.amber}}>{c.title+": "+(orig?orig.status:"?")+" → "+c.status}</div>
                        })}
                      </div>}
                  </div>
                </div>}
              </div>
            })()}
          </div>}
        </div>

        {/* MODALS */}
        {modal==="project"&&<Modal onClose={function(){setModal(null)}} theme={t}>
          <h3 style={{margin:"0 0 16px",fontSize:15,fontWeight:700}}>Project Settings</h3>
          <Field label="Project Title" value={form.title||""} onChange={function(v){setForm(function(f){return Object.assign({},f,{title:v})})}} theme={t}/>
          <Field label="Sub-title" value={form.cycle||""} onChange={function(v){setForm(function(f){return Object.assign({},f,{cycle:v})})}} theme={t} placeholder="e.g. Cycle 4" hint="Displayed below the project title."/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Field label="Start" value={form.startDate||""} onChange={function(v){setForm(function(f){return Object.assign({},f,{startDate:v})})}} theme={t} type="date"/>
            <Field label="End" value={form.endDate||""} onChange={function(v){setForm(function(f){return Object.assign({},f,{endDate:v})})}} theme={t} type="date"/>
          </div>
          {form.startDate&&form.endDate&&<div style={{fontSize:11,color:t.textMuted,margin:"-4px 0 8px",padding:"6px 10px",background:t.surfaceAlt,borderRadius:6}}>{"= "+weeksFrom(form.startDate,form.endDate)+" weeks"}</div>}
          <Field label="Current Week" value={form.currentWeek||""} onChange={function(v){setForm(function(f){return Object.assign({},f,{currentWeek:v})})}} theme={t} type="number" hint="Positions the 'Now' marker."/>
          <div style={{borderTop:"1px solid "+t.border,margin:"16px 0",paddingTop:16}}>
            <div style={{fontSize:12,fontWeight:700,marginBottom:8}}>Schedule Buffer</div>
            <Field label="Buffer planned (days)" value={form.bufferDays||""} onChange={function(v){setForm(function(f){return Object.assign({},f,{bufferDays:v})})}} theme={t} type="number" hint="Extra days for unknowns."/>
            <Field label="Slippage (days)" value={form.slippageDays||""} onChange={function(v){setForm(function(f){return Object.assign({},f,{slippageDays:v})})}} theme={t} type="number" hint="Manual: work taking longer than estimated."/>
            {(function(){
              var bT=parseInt(form.bufferDays)||0,bSl=parseInt(form.slippageDays)||0,bSc=scopeChangeDays.net;
              var bU=Math.max(0,bSc+bSl),bL=Math.max(0,bT-bU),bO=bU>bT;
              return <div style={{padding:"10px 12px",background:t.surfaceAlt,borderRadius:8,marginBottom:4}}>
                <div style={{fontSize:11,fontWeight:600,marginBottom:6,color:bO?t.red:t.text}}>Buffer Preview</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px 16px",fontSize:11}}>
                  <span style={{color:t.textMuted}}>Planned:</span><span style={{fontFamily:MO,fontWeight:600}}>{bT+"d"}</span>
                  <span style={{color:t.textMuted}}>Scope (auto):</span><span style={{fontFamily:MO,fontWeight:600,color:bSc>0?t.red:bSc<0?t.green:t.textMuted}}>{(bSc>0?"+":"")+bSc+"d"}</span>
                  <span style={{color:t.textMuted}}>Slippage:</span><span style={{fontFamily:MO,fontWeight:600,color:bSl>0?t.amber:t.textMuted}}>{"+"+bSl+"d"}</span>
                  <span style={{color:t.textMuted,borderTop:"1px solid "+t.border,paddingTop:4}}>Consumed:</span><span style={{fontFamily:MO,fontWeight:700,borderTop:"1px solid "+t.border,paddingTop:4}}>{bU+"d"}</span>
                  <span style={{color:t.textMuted}}>Remaining:</span><span style={{fontFamily:MO,fontWeight:700,color:bO?t.red:t.green}}>{bO?"-"+(bU-bT)+"d (overrun)":bL+"d"}</span>
                </div>
              </div>;
            })()}
          </div>
          <Btn onClick={saveProject} theme={t}>Save Settings</Btn>
        </Modal>}

        {(modal==="add-scope"||modal==="edit-scope")&&<Modal onClose={function(){setModal(null)}} theme={t}>
          <h3 style={{margin:"0 0 14px",fontSize:15,fontWeight:700}}>{modal==="edit-scope"?"Edit Scope":"Add Scope"}</h3>
          <Field label="Name" value={form.name||""} onChange={function(v){setForm(function(f){return Object.assign({},f,{name:v})})}} theme={t}/>
          <Field label="Owner (initials)" value={form.owner||""} onChange={function(v){setForm(function(f){return Object.assign({},f,{owner:v})})}} theme={t}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Field label="Start Week" value={form.startWeek||""} onChange={function(v){setForm(function(f){return Object.assign({},f,{startWeek:v})})}} theme={t} type="number" hint={"W1–W"+totalWeeks}/>
            <Field label="End Week" value={form.endWeek||""} onChange={function(v){setForm(function(f){return Object.assign({},f,{endWeek:v})})}} theme={t} type="number"/>
          </div>
          {parseInt(form.endWeek)>totalWeeks&&<div style={{fontSize:11,color:t.amber,margin:"-4px 0 8px",fontWeight:500}}>{"⚠ Past deadline (W"+totalWeeks+")"}</div>}
          {modal==="edit-scope"&&<Field label="Status" value={form.status||"on-track"} onChange={function(v){setForm(function(f){return Object.assign({},f,{status:v})})}} theme={t} options={["on-track","at-risk","blocked"]}/>}
          <Btn onClick={saveScope} theme={t}>{modal==="edit-scope"?"Save":"Add Scope"}</Btn>
        </Modal>}

        {modal==="add-risk"&&<Modal onClose={function(){setModal(null)}} theme={t}>
          <h3 style={{margin:"0 0 14px",fontSize:15,fontWeight:700}}>Add Risk</h3>
          <Field label="Title" value={form.title||""} onChange={function(v){setForm(function(f){return Object.assign({},f,{title:v})})}} theme={t}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Field label="Probability" value={form.prob||"medium"} onChange={function(v){setForm(function(f){return Object.assign({},f,{prob:v})})}} theme={t} options={["low","medium","high"]}/>
            <Field label="Impact" value={form.impact||"medium"} onChange={function(v){setForm(function(f){return Object.assign({},f,{impact:v})})}} theme={t} options={["low","medium","high"]}/>
          </div>
          <Field label="Mitigation" value={form.mitigation||""} onChange={function(v){setForm(function(f){return Object.assign({},f,{mitigation:v})})}} theme={t}/>
          <Field label="Owner" value={form.owner||""} onChange={function(v){setForm(function(f){return Object.assign({},f,{owner:v})})}} theme={t}/>
          <Btn onClick={addRisk} theme={t}>Add Risk</Btn>
        </Modal>}

        {modal==="snapshot"&&<Modal onClose={function(){setModal(null)}} theme={t}>
          <h3 style={{margin:"0 0 14px",fontSize:15,fontWeight:700}}>Save Snapshot</h3>
          <HelpBanner text={"Captures a full copy of the current project state — "+scopes.length+" scope"+(scopes.length!==1?"s":"")+", risks, and changes."} theme={t}/>
          <Field label="Label" value={form.label||""} onChange={function(v){setForm(function(f){return Object.assign({},f,{label:v})})}} theme={t} placeholder={"Week "+curW+" — …"} hint="Shown in the snapshot list and diff views."/>
          <Btn onClick={saveSnapshot} theme={t}>Save Snapshot</Btn>
        </Modal>}

        {modal==="add-change"&&<Modal onClose={function(){setModal(null)}} theme={t}>
          <h3 style={{margin:"0 0 14px",fontSize:15,fontWeight:700}}>Log a Scope Change</h3>
          <Field label="What changed?" value={form.title||""} onChange={function(v){setForm(function(f){return Object.assign({},f,{title:v})})}} theme={t} placeholder="e.g. SSO requirement added"/>
          <Field label="Affected Scope" value={form.scope||""} onChange={function(v){setForm(function(f){return Object.assign({},f,{scope:v})})}} theme={t}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Field label="Schedule Impact" value={form.impact||""} onChange={function(v){setForm(function(f){return Object.assign({},f,{impact:v})})}} theme={t} placeholder="+3d or -2d" hint="Feeds buffer automatically."/>
            <Field label="Date" value={form.date||""} onChange={function(v){setForm(function(f){return Object.assign({},f,{date:v})})}} theme={t} placeholder="May 17"/>
          </div>
          <Btn onClick={addChange} theme={t}>Log Change</Btn>
        </Modal>}

        <p style={{margin:"20px auto 0",fontSize:9,color:t.textFaint,textAlign:"center",lineHeight:1.6}}>
          Click title for settings · ✎ edit scopes · Tap pills to cycle · Data saved to localStorage
        </p>
      </div></div>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
